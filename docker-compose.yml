services:
  db:
    image: postgres:15
    container_name: geez_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geez_corpus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geez_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geez_corpus"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline_app:
    build: ./pipeline
    container_name: geez_pipeline
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geez_corpus
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geez_corpus
      DB_USER: postgres
      DB_PASSWORD: postgres
    networks:
      - geez_network

networks:
  geez_network:
    driver: bridge

volumes:
  postgres_data:
